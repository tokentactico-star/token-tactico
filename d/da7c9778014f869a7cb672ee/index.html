<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Descarga</title>
<style>body{font-family:sans-serif;background:#141018;color:#eee;text-align:center;padding:40px 16px}
input{font-size:20px;padding:12px;border-radius:8px;border:1px solid #7a3cff;background:#221a2a;color:#eee;width:min(300px,90%)}
button{font-size:20px;padding:16px 28px;border:0;border-radius:10px;background:#7a3cff;color:#fff;margin-top:16px}
#e{margin-top:20px;font-size:16px}</style></head>
<body><h2>Descarga privada</h2>
<input id="c" type="password" placeholder="Contraseña" autocomplete="off"><br>
<button id="b">Descargar</button><div id="e"></div>
<script>
const SAL="a1df57bbe2cf7799c15f8c1d1f5e31e9", ITER=600000, PARTES=["p0.bin","p1.bin","p2.bin"], NOMBRE="LairLord_0.19-prueba.apk", V="19";
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function clave(txt){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(txt),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(SAL),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function descifrar(k,url){
 const r=await fetch(url+"?v="+V,{cache:"no-store"}); if(!r.ok) throw new Error("no se pudo bajar ("+r.status+")");
 const d=new Uint8Array(await r.arrayBuffer());
 return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},k,d.slice(12)));
}
document.getElementById("b").onclick=async()=>{
 const e=document.getElementById("e");
 try{
  e.textContent="Comprobando la contraseña…";
  const k=await clave(document.getElementById("c").value);
  try{ await descifrar(k,"prueba.bin"); }catch(x){ e.textContent="Contraseña incorrecta."; return; }
  const trozos=[];
  for(let i=0;i<PARTES.length;i++){ e.textContent="Bajando "+(i+1)+" de "+PARTES.length+"…"; trozos.push(await descifrar(k,PARTES[i])); }
  const blob=new Blob(trozos,{type:"application/vnd.android.package-archive"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=NOMBRE;
  document.body.appendChild(a); a.click(); e.textContent="Listo: "+(blob.size/1048576).toFixed(0)+" MB";
 }catch(x){ e.textContent="Error: "+x.message+". Vuelve a intentarlo."; }
};
</script></body></html>
